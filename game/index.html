<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>BEAT25D — Game</title><style>html,body{background:#10131c;color:#fff;font:16px system-ui;text-align:center;padding:2rem}</style></head><body><h2>BEAT25D — Đang tải game...</h2><p id="status">Đang tải 13 phần dữ liệu</p><script>(async()=>{try{const n=13;const parts=await Promise.all(Array.from({length:n},(_,i)=>fetch('data/part-'+String(i).padStart(3,'0')+'.txt').then(r=>{if(!r.ok)throw Error('Không tải được phần '+i);return r.text()})));document.getElementById('status').textContent='Đang khởi động game...';const raw=atob(parts.join(''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const doc=new TextDecoder().decode(bytes);document.open();document.write(doc);document.close()}catch(e){document.getElementById('status').textContent='Lỗi khởi động: '+e.message;console.error(e)}})();</script></body></html>
